<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SLAM RUNNER — Daylight Arena Basketball Runner</title>
    <meta name="description" content="Sprint down the basketball court in star-filled arena mode, dribbling, dodging defenders, and slamming dunks in this athletic basketball runner." />
    <meta name="theme-color" content="#070a1a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;700;800;900&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #070a1a;
        font-family: 'Montserrat', sans-serif;
        touch-action: none; /* Prevent pull-to-refresh on mobile */
        color: #e2e8f0;
      }
      .font-athletic {
        font-family: 'Bebas Neue', sans-serif;
        letter-spacing: 0.05em;
      }
      .font-cyber {
        font-family: 'Bebas Neue', 'Orbitron', sans-serif;
        letter-spacing: 0.05em;
      }
      /* Initial boot splash while the bundle loads */
      #boot-splash {
        position: fixed;
        inset: 0;
        background: radial-gradient(80% 60% at 50% -10%, rgba(255,107,26,0.35) 0%, transparent 60%),
          linear-gradient(180deg, #0c1230 0%, #070a1a 60%, #03040d 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #boot-splash .logo {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(44px, 8vw, 76px);
        letter-spacing: 0.12em;
        color: #ff8a3d;
        text-shadow: 0 0 22px rgba(255,107,26,0.7), 0 4px 0 rgba(0,0,0,0.5);
      }
      #boot-splash .logo span { color: #fff; }
      #boot-splash .bar {
        width: 220px; height: 4px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
        clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      }
      #boot-splash .bar i {
        display: block; height: 100%; width: 40%;
        background: linear-gradient(90deg, #ff6b1a, #ffc53d);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(380%); }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="logo">SLAM<span>RUNNER</span></div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
